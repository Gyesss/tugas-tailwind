<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrasi Siswa</title>
    <!-- Tailwind CSS CDN v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body
    class="min-h-screen flex items-center justify-center bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.3),rgba(255,255,255,0))] px-4 py-10 relative overflow-y-auto"
  >
    <!-- Ambient Glowing Orbs -->
    <div
      class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-96 h-96 bg-violet-600/15 rounded-full blur-3xl pointer-events-none"
    ></div>

    <div class="w-full max-w-2xl relative z-10 my-auto">
      <!-- Form Card -->
      <form
        class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl shadow-2xl shadow-indigo-950/50 p-8 space-y-6"
      >
        <!-- Header -->
        <div class="text-center border-b pb-5 border-slate-800">
          <div
            class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-3"
          >
            <i class="fa-solid fa-user-plus text-xl"></i>
          </div>
          <h1 class="text-3xl font-extrabold text-slate-100 tracking-tight">
            Pendaftaran Siswa
          </h1>
          <p class="text-slate-400 mt-1.5 text-sm">
            Isi data diri Anda untuk membuat akun baru
          </p>
        </div>

        <!-- Grid Input 2 Kolom untuk Layar Sedang/Besar -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Nama Lengkap -->
          <div class="md:col-span-2">
            <label
              for="nama"
              class="block text-sm font-semibold text-slate-300 mb-1.5"
              >Nama Lengkap</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
              >
                <i class="fa-regular fa-user"></i>
              </div>
              <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Saint"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
              />
            </div>
          </div>

          <!-- Email -->
          <div>
            <label
              for="email"
              class="block text-sm font-semibold text-slate-300 mb-1.5"
              >Email</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
              >
                <i class="fa-regular fa-envelope"></i>
              </div>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="nama@email.com"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
              />
            </div>
          </div>

          <!-- No HP -->
          <div>
            <label
              for="nohp"
              class="block text-sm font-semibold text-slate-300 mb-1.5"
              >Nomor HP</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
              >
                <i class="fa-solid fa-phone text-xs"></i>
              </div>
              <input
                type="tel"
                id="nohp"
                name="nohp"
                placeholder="081234567890"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
              />
            </div>
          </div>

          <!-- Tanggal Lahir -->
          <div>
            <label
              for="tanggal_lahir"
              class="block text-sm font-semibold text-slate-300 mb-1.5"
              >Tanggal Lahir</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
              >
                <i class="fa-regular fa-calendar"></i>
              </div>
              <input
                type="date"
                id="tanggal_lahir"
                name="tanggal_lahir"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 [color-scheme:dark]"
              />
            </div>
          </div>

          <!-- Gender -->
          <div>
            <label
              for="gender"
              class="block text-sm font-semibold text-slate-300 mb-1.5"
              >Jenis Kelamin</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
              >
                <i class="fa-solid fa-venus-mars text-xs"></i>
              </div>
              <select
                id="gender"
                name="gender"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
              >
                <option
                  value=""
                  disabled
                  selected
                  class="bg-slate-900 text-slate-400"
                >
                  Pilih Jenis Kelamin
                </option>
                <option value="Laki-laki" class="bg-slate-900 text-slate-100">
                  Laki-laki
                </option>
                <option value="Perempuan" class="bg-slate-900 text-slate-100">
                  Perempuan
                </option>
              </select>
            </div>
          </div>

          <!-- Password -->
          <div class="md:col-span-2">
            <label
              for="password"
              class="block text-sm font-semibold text-slate-300 mb-1.5"
              >Password</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
              >
                <i class="fa-solid fa-lock"></i>
              </div>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Buat password minimal 8 karakter"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
              />
            </div>
          </div>

          <!-- Alamat -->
          <div class="md:col-span-2">
            <label
              for="alamat"
              class="block text-sm font-semibold text-slate-300 mb-1.5"
              >Alamat Lengkap</label
            >
            <div class="relative">
              <div
                class="absolute top-3 left-0 pl-3.5 flex items-start pointer-events-none text-slate-500"
              >
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <textarea
                id="alamat"
                name="alamat"
                rows="3"
                placeholder="Jl. Soekarno Hatta No. 123, Bandung"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 resize-none"
              ></textarea>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/25 transition duration-200 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
        >
          <i class="fa-solid fa-paper-plane text-sm"></i>
          Daftar Sekarang
        </button>

        <!-- Login Link -->
        <p class="text-center text-sm text-slate-400 pt-1">
          Sudah punya akun?
          <a
            href="tugas3a.html"
            class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors hover:underline ml-1"
          >
            Login di sini
          </a>
        </p>
      </form>

      <!-- Footer -->
      <p
        class="text-center text-slate-500 text-xs mt-6 font-medium tracking-wide"
      >
        © Akhtar Raufasha A.G., XII RPL
      </p>
    </div>
  </body>
</html>
