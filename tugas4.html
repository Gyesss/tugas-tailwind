<!doctype html>
<html lang="id">
  <head>
    <title>Mini Proyek Modul 9</title>
    <!-- Menambahkan Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-amber-50/50 font-sans text-stone-800">
    <!-- NAVBAR UTAMA -->
    <header
      class="bg-emerald-950 border-b border-emerald-900/40 px-6 py-4 flex justify-between items-center shadow-md"
    >
      <!-- KELOMPOK KIRI: Logo + Nama Sekolah -->
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-emerald-950 font-black text-xl shadow-lg shadow-emerald-500/20"
        >
          R
        </div>
        <div>
          <h1
            class="font-extrabold text-white text-base tracking-tight leading-none"
          >
            RPL DevPortal
          </h1>
          <p
            class="text-[11px] font-semibold text-emerald-400/90 mt-1 uppercase tracking-wider"
          >
            SMKS ICB Cinta Niaga
          </p>
        </div>
      </div>

      <!-- KELOMPOK TENGAH: Menu Navigasi -->
      <nav
        class="hidden md:flex items-center gap-8 text-sm font-semibold text-emerald-200/70"
      >
        <a
          href="#"
          class="text-emerald-400 font-bold border-b-2 border-emerald-400 pb-0.5"
          >Beranda</a
        >
        <a href="#" class="hover:text-emerald-100 transition-colors"
          >Jadwal Pelajaran</a
        >
        <a href="#" class="hover:text-emerald-100 transition-colors"
          >Tugas PjBL</a
        >
        <a href="#" class="hover:text-emerald-100 transition-colors">E-Rapot</a>
      </nav>

      <!-- KELOMPOK KANAN: Tombol Aksi -->
      <div class="flex items-center gap-4">
        <span class="text-xs text-emerald-200/80 font-medium hidden sm:inline"
          >Halo, <strong class="text-white font-semibold">Reza</strong></span
        >
        <button
          class="bg-emerald-500 hover:bg-emerald-400 text-emerald-950 text-xs font-bold px-5 py-2.5 rounded-full transition-all duration-200 shadow-md hover:shadow-emerald-500/20"
        >
          Keluar &rarr;
        </button>
      </div>
    </header>

    <!-- KONTEN DUMMY DI BAWAH NAVBAR -->
    <main class="p-8 max-w-4xl mx-auto text-center">
      <div
        class="bg-white p-8 rounded-3xl border border-stone-200/80 shadow-sm mt-6"
      >
        <h2 class="text-xl font-extrabold text-stone-900 tracking-tight">
          Selamat Datang di Portal Rekayasa Perangkat Lunak!
        </h2>
        <p class="text-sm text-stone-500 mt-2 leading-relaxed">
          Perhatikan bagaimana komponen Navbar di atas tertata rapi dari ujung
          kiri hingga kanan berkat kekuatan Flexbox.
        </p>
      </div>
    </main>
  </body>
</html>
