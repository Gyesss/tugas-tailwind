<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body
    class="min-h-screen flex items-center justify-center bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.3),rgba(255,255,255,0))] px-4 py-8 relative overflow-y-auto"
  >
    <div
      class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-80 h-80 bg-violet-600/15 rounded-full blur-3xl pointer-events-none"
    ></div>

    <div class="w-full max-w-md relative z-10 my-auto">
      <form
        class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl shadow-2xl shadow-indigo-950/50 p-8 space-y-5"
      >
        <div class="text-center">
          <div
            class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-3"
          >
            <i class="fa-solid fa-user-lock text-xl"></i>
          </div>
          <h1 class="text-3xl font-extrabold text-slate-100 tracking-tight">
            Selamat Datang
          </h1>
          <p class="text-slate-400 mt-1.5 text-sm">
            Silahkan login untuk melanjutkan
          </p>
        </div>

        <div>
          <label
            for="email"
            class="block text-sm font-semibold text-slate-300 mb-2"
          >
            Email
          </label>
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
            >
              <i class="fa-regular fa-envelope"></i>
            </div>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="nama@email.com"
              required
              autocomplete="email"
              class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
            />
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label
              for="password"
              class="block text-sm font-semibold text-slate-300"
            >
              Password
            </label>
          </div>
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"
            >
              <i class="fa-solid fa-lock"></i>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Masukkan password"
              required
              autocomplete="current-password"
              class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 outline-none transition duration-200 focus:bg-slate-950 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-sm pt-1">
          <label class="flex items-center gap-2.5 cursor-pointer group">
            <input
              type="checkbox"
              name="remember"
              class="w-4 h-4 text-indigo-600 bg-slate-950 border-slate-700 rounded focus:ring-indigo-500/30 focus:ring-2 accent-indigo-600"
            />
            <span
              class="text-slate-400 group-hover:text-slate-300 transition-colors"
              >Ingat Saya</span
            >
          </label>
          <a
            href="#"
            class="font-medium text-indigo-400 hover:text-indigo-300 transition-colors hover:underline"
          >
            Lupa Password?
          </a>
        </div>

        <button
          type="submit"
          class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/25 transition duration-200 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
        >
          <i class="fa-solid fa-right-to-bracket text-sm"></i>
          Login
        </button>

        <a
          href="tugas3c.html"
          class="w-full flex items-center justify-center gap-2 bg-emerald-600/90 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 text-center"
        >
          <i class="fa-solid fa-address-book text-sm"></i>
          Lihat Data Siswa
        </a>

        <div class="flex items-center gap-3 my-1">
          <div class="h-px flex-1 bg-slate-800"></div>
          <span
            class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
            >ATAU</span
          >
          <div class="h-px flex-1 bg-slate-800"></div>
        </div>

        <p class="text-center text-sm text-slate-400 pt-1">
          Belum punya akun?
          <a
            href="tugas3b.html"
            class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors hover:underline ml-1"
          >
            Daftar sekarang
          </a>
        </p>
      </form>

      <p
        class="text-center text-slate-500 text-xs mt-6 font-medium tracking-wide"
      >
        © Akhtar Raufasha A.G., XII RPL
      </p>
    </div>
  </body>
</html>
